[package]
name = "aquanex"
version = "1.0.0"
description = "Aquanex — SovereignWorkbench MRPL Industrial AI"
authors = ["The Team"]
edition = "2021"

[lib]
name = "aquanex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

