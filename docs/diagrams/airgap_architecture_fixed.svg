<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 730" width="1020" height="730" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- ==================== OUTER AIR-GAP PERIMETER ==================== -->
  <g id="outer-perimeter">
    <rect x="20" y="15" width="980" height="695" rx="14" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="10 5"/>
    <rect x="20" y="15" width="980" height="34" rx="14" fill="#1e3a8a"/>
    <!-- Overwrite bottom rounded corners of header -->
    <rect x="20" y="35" width="980" height="14" fill="#1e3a8a"/>
    <text x="510" y="37" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">
      AIR-GAPPED CONTROL NETWORK (192.168.1.0/24) — STRICT ZERO-EGRESS INDUSTRIAL FABRIC
    </text>
  </g>

  <!-- ==================== LAYER 1: CLIENT WORKSTATIONS ==================== -->
  <g id="layer-1" transform="translate(40, 60)">
    <rect x="0" y="0" width="940" height="84" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="18" y="20" fill="#0369a1" font-size="10.5" font-weight="700" letter-spacing="0.4">LAYER 1: CLIENT WORKSTATIONS &amp; IT GOVERNANCE</text>

    <!-- Senior Lead -->
    <g transform="translate(15, 28)">
      <rect x="0" y="0" width="288" height="46" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="12" y="18" fill="#0369a1" font-size="11" font-weight="700">Senior Inspection Lead</text>
      <text x="175" y="18" fill="#64748b" font-size="9.5" font-weight="500">192.168.1.102</text>
      <text x="12" y="34" fill="#475569" font-size="9">Native Desktop App • All Models (100B / 32B / 8B) • Co-Sign</text>
    </g>

    <!-- Field Tech -->
    <g transform="translate(320, 28)">
      <rect x="0" y="0" width="288" height="46" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="12" y="18" fill="#0891b2" font-size="11" font-weight="700">Field Inspection Tech</text>
      <text x="175" y="18" fill="#64748b" font-size="9.5" font-weight="500">192.168.1.103</text>
      <text x="12" y="34" fill="#475569" font-size="9">Ruggedized Terminal • Edge Tier (8B / Needle 2) • Fast NDT</text>
    </g>

    <!-- IT Admin -->
    <g transform="translate(625, 28)">
      <rect x="0" y="0" width="298" height="46" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="12" y="18" fill="#b91c1c" font-size="11" font-weight="700">IT &amp; Security Admin</text>
      <text x="175" y="18" fill="#64748b" font-size="9.5" font-weight="500">192.168.1.101</text>
      <text x="12" y="34" fill="#475569" font-size="9">Cluster Console • Model RBAC Matrix • SHA-256 Ledger Audit</text>
    </g>
  </g>

  <!-- Connectors: L1 -> L2 -->
  <line x1="199" y1="144" x2="199" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="504" y1="144" x2="504" y2="160" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="814" y1="144" x2="814" y2="160" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- ==================== LAYER 2: SOVEREIGN GATEWAY ==================== -->
  <g id="layer-2" transform="translate(40, 162)">
    <rect x="0" y="0" width="940" height="74" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="18" y="18" fill="#92400e" font-size="10.5" font-weight="700" letter-spacing="0.4">
      LAYER 2: SOVEREIGN GATEWAY &amp; AIR-GAP SECURITY PERIMETER (NODE 1 — 192.168.1.100)
    </text>

    <!-- Gateway REST -->
    <g transform="translate(15, 26)">
      <rect x="0" y="0" width="288" height="38" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="16" fill="#b45309" font-size="10.5" font-weight="700">FastAPI Gateway (Port 8000)</text>
      <text x="12" y="30" fill="#64748b" font-size="9">REST + SSE Streaming • Service Lifecycle</text>
    </g>

    <!-- RBAC Filter -->
    <g transform="translate(320, 26)">
      <rect x="0" y="0" width="288" height="38" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="16" fill="#b45309" font-size="10.5" font-weight="700">Pre-Retrieval ABAC &amp; Role Filter</text>
      <text x="12" y="30" fill="#64748b" font-size="9">Role Identity • Model-Tier Entitlements &amp; Tokens</text>
    </g>

    <!-- Watchdog -->
    <g transform="translate(625, 26)">
      <rect x="0" y="0" width="298" height="38" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <text x="12" y="16" fill="#dc2626" font-size="10.5" font-weight="700">Network Isolation Watchdog</text>
      <text x="12" y="30" fill="#b91c1c" font-size="8.5" font-weight="600">/proc/net/route probe • Default WAN blocked (403)</text>
    </g>
  </g>

  <!-- Connectors: L2 -> L3 -->
  <path d="M 504 236 L 504 246 L 150 246 L 150 256" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="280" y="244" fill="#5b21b6" font-size="9" font-weight="700">Authorized Requests</text>

  <!-- ==================== LAYER 3: LANGGRAPH ENGINE ==================== -->
  <g id="layer-3" transform="translate(40, 258)">
    <rect x="0" y="0" width="940" height="154" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="18" y="18" fill="#5b21b6" font-size="10.5" font-weight="700" letter-spacing="0.4">
      LAYER 3: DETERMINISTIC LANGGRAPH STATE ENGINE (4 CONSOLIDATED PIPELINE PHASES)
    </text>

    <!-- Stage 1 -->
    <g transform="translate(15, 28)">
      <rect x="0" y="0" width="180" height="56" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.8"/>
      <text x="10" y="18" fill="#4338ca" font-size="10.5" font-weight="700">1. Intake &amp; Extraction</text>
      <text x="10" y="34" fill="#475569" font-size="9">Prompt Router + Qwen2-VL</text>
      <text x="10" y="47" fill="#64748b" font-size="8.5">P&amp;ID blueprints &amp; NDT logs</text>
    </g>

    <!-- Connector S1 -> S2 -->
    <line x1="195" y1="56" x2="217" y2="56" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

    <!-- Stage 2 -->
    <g transform="translate(220, 28)">
      <rect x="0" y="0" width="190" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
      <text x="10" y="18" fill="#15803d" font-size="10.5" font-weight="700">2. Standards &amp; Code Gen</text>
      <text x="10" y="34" fill="#475569" font-size="9">ABAC ChromaDB (API 570)</text>
      <text x="10" y="47" fill="#64748b" font-size="8.5">Deterministic Python synthesis</text>
    </g>

    <!-- Connector S2 -> S3 -->
    <line x1="410" y1="56" x2="432" y2="56" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

    <!-- Stage 3 -->
    <g transform="translate(435, 28)">
      <rect x="0" y="0" width="198" height="56" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.8"/>
      <text x="10" y="18" fill="#be123c" font-size="10.5" font-weight="700">3. Bubblewrap Sandbox</text>
      <text x="10" y="34" fill="#475569" font-size="9">Linux Container (/usr/bin/bwrap)</text>
      <text x="10" y="47" fill="#64748b" font-size="8.5">256MB RAM limit • 5s timeout</text>
    </g>

    <!-- Connector S3 -> Diamond -->
    <line x1="633" y1="56" x2="655" y2="56" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

    <!-- Pass? Diamond -->
    <g transform="translate(658, 31)">
      <polygon points="26,0 52,25 26,50 0,25" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="26" y="29" fill="#713f12" font-size="10" font-weight="800" text-anchor="middle">Pass?</text>
    </g>

    <!-- Pass -> Stage 4 -->
    <line x1="710" y1="56" x2="736" y2="56" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
    <text x="722" y="48" fill="#15803d" font-size="9" font-weight="800">Yes</text>

    <!-- Stage 4 -->
    <g transform="translate(740, 28)">
      <rect x="0" y="0" width="185" height="56" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.8"/>
      <text x="10" y="18" fill="#7e22ce" font-size="10.5" font-weight="700">4. Assembly &amp; Audit</text>
      <text x="10" y="34" fill="#475569" font-size="9">Omni-modal file compilers</text>
      <text x="10" y="47" fill="#64748b" font-size="8.5">SHA-256 ledger block chained</text>
    </g>

    <!-- Self Healing Banner & Retry Loop -->
    <g transform="translate(240, 98)">
      <rect x="0" y="0" width="460" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="14" y="18" fill="#b91c1c" font-size="10" font-weight="700">Error Analysis &amp; Self-Healing Loop (Max 3 Attempts)</text>
      <text x="14" y="32" fill="#475569" font-size="8.5">Distills execution traceback • Diagnoses syntax/logic bugs • Re-synthesizes code</text>
    </g>

    <!-- Fail arrow from Diamond to Self Healing -->
    <path d="M 684 81 L 684 94" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="690" y="90" fill="#b91c1c" font-size="8.5" font-weight="700">No</text>

    <!-- Retry arrow from Self Healing to Stage 2 -->
    <path d="M 240 119 L 205 119 L 205 90 L 225 90" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
    <text x="155" y="110" fill="#b91c1c" font-size="8" font-weight="700">Retry loop</text>
  </g>

  <!-- ==================== LAYER 4: COMPUTE & STORAGE ==================== -->
  <g id="layer-4" transform="translate(40, 424)">
    <rect x="0" y="0" width="940" height="82" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="18" y="18" fill="#065f46" font-size="10.5" font-weight="700" letter-spacing="0.4">
      LAYER 4: COMPUTE, LOCAL INFERENCE &amp; SECURE STORAGE (LOOPBACK ONLY)
    </text>

    <!-- Models Engine -->
    <g transform="translate(15, 26)">
      <rect x="0" y="0" width="475" height="46" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="12" y="17" fill="#047857" font-size="10.5" font-weight="700">Local Inference Tier (vLLM / Ollama / Needle 2)</text>
      <text x="12" y="31" fill="#475569" font-size="8.5">Reasoning: DeepSeek-R1 (70B / 32B / 8B) • Vision: Qwen2-VL (72B / 7B)</text>
      <text x="12" y="42" fill="#059669" font-size="8" font-weight="600">Needle 2 (45M / 28MB RAM) • Sequential residency; unloaded after each pass</text>
    </g>

    <!-- Storage Engine -->
    <g transform="translate(505, 26)">
      <rect x="0" y="0" width="420" height="46" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="12" y="17" fill="#047857" font-size="10.5" font-weight="700">Persistent On-Premise Data Stores</text>
      <text x="12" y="31" fill="#475569" font-size="8.5">ChromaDB: OISD-118, ASME, API 570 vector store (CPU FastEmbed)</text>
      <text x="12" y="42" fill="#047857" font-size="8" font-weight="600">SQLite mrpl_audit.db: Cryptographic SHA-256 hash-chained ledger</text>
    </g>
  </g>

  <!-- Connectors: L3 -> Storage (Ledger commit) -->
  <path d="M 832 342 L 832 355 L 750 355 L 750 445" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <text x="760" y="375" fill="#0f766e" font-size="8.5" font-weight="700">Append SHA-256</text>

  <!-- ==================== LAYER 5: CONSOLIDATED DELIVERABLES ==================== -->
  <g id="layer-5" transform="translate(40, 518)">
    <rect x="0" y="0" width="940" height="175" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="18" y="20" fill="#1e293b" font-size="10.5" font-weight="700" letter-spacing="0.4">
      LAYER 5: CONSOLIDATED PRODUCTION DELIVERABLES (MRPL STATUTORY SUITE)
    </text>

    <!-- Group 1: Reports -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="215" height="128" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="0" y="0" width="215" height="26" rx="8" fill="#eff6ff"/>
      <rect x="0" y="16" width="215" height="10" fill="#eff6ff"/>
      <text x="10" y="17" fill="#1d4ed8" font-size="10" font-weight="700">Statutory Reports &amp; Certs</text>
      
      <circle cx="15" cy="45" r="4" fill="#2563eb"/>
      <text x="26" y="48" fill="#0f172a" font-size="9" font-weight="700">report.docx</text>
      <text x="90" y="48" fill="#64748b" font-size="8.5">Statutory Watermark</text>

      <circle cx="15" cy="75" r="4" fill="#2563eb"/>
      <text x="26" y="78" fill="#0f172a" font-size="9" font-weight="700">cert.pdf</text>
      <text x="75" y="78" fill="#64748b" font-size="8.5">OISD-118 Sign-off</text>

      <circle cx="15" cy="105" r="4" fill="#2563eb"/>
      <text x="26" y="108" fill="#0f172a" font-size="9" font-weight="700">briefing.pptx</text>
      <text x="95" y="108" fill="#64748b" font-size="8.5">Executive Slides</text>
    </g>

    <!-- Group 2: CAD & 3D -->
    <g transform="translate(245, 32)">
      <rect x="0" y="0" width="215" height="128" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
      <rect x="0" y="0" width="215" height="26" rx="8" fill="#ecfeff"/>
      <rect x="0" y="16" width="215" height="10" fill="#ecfeff"/>
      <text x="10" y="17" fill="#0e7490" font-size="10" font-weight="700">Engineering CAD &amp; 3D</text>

      <circle cx="15" cy="50" r="4" fill="#0891b2"/>
      <text x="26" y="53" fill="#0f172a" font-size="9" font-weight="700">drawing.dxf</text>
      <text x="95" y="53" fill="#64748b" font-size="8.5">AutoCAD 2D Spool</text>

      <circle cx="15" cy="90" r="4" fill="#0891b2"/>
      <text x="26" y="93" fill="#0f172a" font-size="9" font-weight="700">spool.stl</text>
      <text x="80" y="93" fill="#64748b" font-size="8.5">3D Printable Mesh</text>
    </g>

    <!-- Group 3: Data & Inspection -->
    <g transform="translate(475, 32)">
      <rect x="0" y="0" width="225" height="128" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="26" rx="8" fill="#f0fdf4"/>
      <rect x="0" y="16" width="225" height="10" fill="#f0fdf4"/>
      <text x="10" y="17" fill="#15803d" font-size="10" font-weight="700">Inspection Analytics &amp; Logs</text>

      <circle cx="15" cy="45" r="4" fill="#16a34a"/>
      <text x="26" y="48" fill="#0f172a" font-size="9" font-weight="700">matrix.xlsx</text>
      <text x="90" y="48" fill="#64748b" font-size="8.5">Live Formulas (Capex)</text>

      <circle cx="15" cy="75" r="4" fill="#16a34a"/>
      <text x="26" y="78" fill="#0f172a" font-size="9" font-weight="700">heatmap.png</text>
      <text x="100" y="78" fill="#64748b" font-size="8.5">UTG Thickness Grid</text>

      <circle cx="15" cy="105" r="4" fill="#16a34a"/>
      <text x="26" y="108" fill="#0f172a" font-size="9" font-weight="700">survey.csv</text>
      <text x="88" y="108" fill="#64748b" font-size="8.5">SAP-PM Import Log</text>
    </g>

    <!-- Group 4: Audit & Verification -->
    <g transform="translate(715, 32)">
      <rect x="0" y="0" width="210" height="128" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
      <rect x="0" y="0" width="210" height="26" rx="8" fill="#fefce8"/>
      <rect x="0" y="16" width="210" height="10" fill="#fefce8"/>
      <text x="10" y="17" fill="#a16207" font-size="10" font-weight="700">Verification &amp; Audit Trail</text>

      <circle cx="15" cy="50" r="4" fill="#ca8a04"/>
      <text x="26" y="53" fill="#0f172a" font-size="9" font-weight="700">verify.py</text>
      <text x="75" y="53" fill="#64748b" font-size="8.5">Field Recalc Script</text>

      <circle cx="15" cy="90" r="4" fill="#ca8a04"/>
      <text x="26" y="93" fill="#0f172a" font-size="9" font-weight="700">audit.json</text>
      <text x="80" y="93" fill="#64748b" font-size="8.5">SHA-256 Manifest</text>
    </g>
  </g>

  <!-- Connectors: L3 -> Deliverables -->
  <path d="M 915 342 L 915 510" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="922" y="470" fill="#334155" font-size="8.5" font-weight="700" transform="rotate(90 922 470)">Compiles 10 Deliverables</text>

</svg>